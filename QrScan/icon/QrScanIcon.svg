<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title description">
    <title id="title">QrScan app icon</title>
    <desc id="description">A minimal black and white QR tile floating inside a scanner viewfinder with a horizontal scan beam.</desc>

    <!-- Opaque warm-white canvas. iOS applies the final icon mask. -->
    <rect width="1024" height="1024" fill="#F5F3EE"/>

    <!-- Scanner viewfinder. -->
    <g fill="none" stroke="#111111" stroke-width="44" stroke-linecap="round" stroke-linejoin="round">
        <path d="M330 176H220C196 176 176 196 176 220V330"/>
        <path d="M694 176H804C828 176 848 196 848 220V330"/>
        <path d="M330 848H220C196 848 176 828 176 804V694"/>
        <path d="M694 848H804C828 848 848 828 848 804V694"/>
    </g>

    <!-- Offset card shadow and crisp face. -->
    <rect x="252" y="238" width="568" height="600" rx="74" fill="#C5C2BA"/>
    <rect x="226" y="212" width="568" height="600" rx="74" fill="#111111"/>
    <rect x="246" y="232" width="528" height="560" rx="56" fill="#FFFFFF"/>
    <rect x="302" y="250" width="280" height="12" rx="6" fill="#F5F3EE"/>

    <!-- Three QR finder marks. -->
    <g>
        <g transform="translate(310 292)">
            <rect width="126" height="126" rx="18" fill="#111111"/>
            <rect x="27" y="27" width="72" height="72" rx="10" fill="#FFFFFF"/>
            <rect x="47" y="47" width="32" height="32" rx="6" fill="#111111"/>
        </g>
        <g transform="translate(584 292)">
            <rect width="126" height="126" rx="18" fill="#111111"/>
            <rect x="27" y="27" width="72" height="72" rx="10" fill="#FFFFFF"/>
            <rect x="47" y="47" width="32" height="32" rx="6" fill="#111111"/>
        </g>
        <g transform="translate(310 566)">
            <rect width="126" height="126" rx="18" fill="#111111"/>
            <rect x="27" y="27" width="72" height="72" rx="10" fill="#FFFFFF"/>
            <rect x="47" y="47" width="32" height="32" rx="6" fill="#111111"/>
        </g>
    </g>

    <!-- Sparse, intentionally non-scannable QR modules. -->
    <g fill="#111111">
        <rect x="470" y="292" width="48" height="48" rx="8"/>
        <rect x="518" y="340" width="48" height="48" rx="8"/>
        <rect x="470" y="388" width="96" height="48" rx="8"/>
        <rect x="310" y="454" width="48" height="48" rx="8"/>
        <rect x="374" y="454" width="48" height="48" rx="8"/>
        <rect x="470" y="454" width="48" height="48" rx="8"/>
        <rect x="534" y="454" width="48" height="48" rx="8"/>
        <rect x="598" y="454" width="112" height="48" rx="8"/>
        <rect x="454" y="566" width="48" height="112" rx="8"/>
        <rect x="518" y="566" width="48" height="48" rx="8"/>
        <rect x="582" y="566" width="48" height="48" rx="8"/>
        <rect x="646" y="566" width="64" height="48" rx="8"/>
        <rect x="518" y="630" width="112" height="48" rx="8"/>
        <rect x="646" y="630" width="64" height="64" rx="8"/>
        <rect x="310" y="710" width="48" height="28" rx="7"/>
        <rect x="374" y="710" width="112" height="28" rx="7"/>
        <rect x="534" y="710" width="48" height="28" rx="7"/>
        <rect x="598" y="710" width="112" height="28" rx="7"/>
    </g>

    <!-- Scan beam: dark housing with a bright central slit. -->
    <rect x="274" y="504" width="476" height="28" rx="14" fill="#9F9C95"/>
    <rect x="260" y="490" width="476" height="28" rx="14" fill="#111111"/>
    <rect x="286" y="500" width="424" height="8" rx="4" fill="#FFFFFF"/>
</svg>
